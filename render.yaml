services:
  - type: web
    name: openreply-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker-web --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0
      - key: COMMENT_POLL_INTERVAL_MS
        value: "300000"
      - key: COMMENT_POLL_MAX_PER_SWEEP
        value: "30"
      - key: COMMENT_POLL_LOOKBACK_HOURS
        value: "72"
