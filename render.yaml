services:
  - type: worker
    name: openreply-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker --workspace=backend
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: openreply-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0
      - key: COMMENT_POLL_INTERVAL_MS
        value: "300000"
      - key: COMMENT_POLL_MAX_PER_SWEEP
        value: "30"
      - key: COMMENT_POLL_LOOKBACK_HOURS
        value: "72"

databases:
  - name: openreply-db
    databaseName: openreply
    user: openreply
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "16"
